name: Web (Next.js)

on:
  push:
    branches: [main]
    paths-ignore: ["mobile/**", "docs/**", "*.md"]
  pull_request:
    paths-ignore: ["mobile/**", "docs/**", "*.md"]
  workflow_dispatch:

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
