name: Mobile (Flutter)

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:

env:
  # Alamat API untuk build rilis. Atur di Settings > Secrets and variables > Actions > Variables.
  # Sengaja tanpa nilai bawaan: build Android/iOS gagal jelas bila kosong (lihat langkah "Pastikan API_BASE_URL terisi").
  API_BASE_URL: ${{ vars.API_BASE_URL }}
  # Nomor build = nomor run workflow (selalu naik). Dipakai aplikasi untuk cek "update wajib"
  # dan harus diisikan ke Panel Admin > Rilis aplikasi saat menerbitkan rilis.
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  test:
    name: Analisis dan unit test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --coverage
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: mobile/coverage/lcov.info

  build-android:
    name: Build Android (APK)
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - name: Pastikan API_BASE_URL terisi
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::error title=API_BASE_URL kosong::Isi variabel repositori API_BASE_URL (Settings > Secrets and variables > Actions > Variables) dengan alamat Vercel, mis. https://nama-proyek.vercel.app, lalu jalankan ulang workflow."
            exit 1
          fi
          case "$API_BASE_URL" in
            https://*) ;;
            *) echo "::error title=API_BASE_URL harus https::Nilai saat ini bukan alamat https. Build rilis wajib https agar sandi dan data warga tidak bisa disadap di jaringan."; exit 1 ;;
          esac
      - name: Pastikan kunci tanda tangan tersedia
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KS_ALIAS" ] || [ -z "$KS_KEYPASS" ]; then
            echo "::error title=Kunci tanda tangan Android belum diatur::Tanpa kunci tetap, setiap build ditandatangani kunci acak dan update TIDAK bisa menimpa versi terpasang. Jalankan mobile/tool/create-keystore.ps1 sekali, lalu buat 4 GitHub Secret: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD (lihat README, bagian Kunci tanda tangan Android)."
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Baca nama versi dari pubspec.yaml
        id: ver
        run: |
          VERSION_NAME=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([^+ ]+).*/\1/')
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
      - name: Siapkan platform dan tanda tangan rilis
        run: bash tool/prepare_platforms.sh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: flutter pub get
      - name: Build APK
        run: >
          flutter build apk --release
          --build-name=${{ steps.ver.outputs.name }}
          --build-number=${{ env.BUILD_NUMBER }}
          --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}
          --dart-define=BUILD_NUMBER=${{ env.BUILD_NUMBER }}
          --dart-define=APP_VERSION=${{ steps.ver.outputs.name }}
      - name: Verifikasi tanda tangan APK
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk | tee "$RUNNER_TEMP/cert.txt"
          if grep -qi "CN=Android Debug" "$RUNNER_TEMP/cert.txt"; then
            echo "::error title=APK masih memakai kunci debug::Kunci rilis tidak terpakai sehingga update tidak akan bisa menimpa versi terpasang. Periksa langkah Siapkan platform dan tanda tangan rilis."
            exit 1
          fi
          SHA=$(grep -m1 "certificate SHA-256 digest" "$RUNNER_TEMP/cert.txt" | sed 's/.*: //')
          echo "CERT_SHA256=$SHA" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: kampung-digital-apk-build-${{ env.BUILD_NUMBER }}
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
      - name: Ringkasan rilis
        run: |
          {
            echo "### APK Android siap dirilis"
            echo "- Versi: **${{ steps.ver.outputs.name }}**"
            echo "- Nomor build: **${{ env.BUILD_NUMBER }}**"
            echo "- Sidik jari tanda tangan (SHA-256): \`$CERT_SHA256\` (harus **sama** di setiap build; bila berubah, update tidak bisa menimpa)"
            echo "- Langkah: unduh artefak, unggah APK ke tempat unduhan (mis. GitHub Release), lalu isi **Panel Admin > Rilis aplikasi > Rilis baru** dengan versi, build, dan tautan itu."
          } >> "$GITHUB_STEP_SUMMARY"

  build-ios:
    name: Build iOS (tanpa code signing)
    needs: test
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - name: Pastikan API_BASE_URL terisi
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::error title=API_BASE_URL kosong::Isi variabel repositori API_BASE_URL (Settings > Secrets and variables > Actions > Variables) dengan alamat Vercel, mis. https://nama-proyek.vercel.app, lalu jalankan ulang workflow."
            exit 1
          fi
          case "$API_BASE_URL" in
            https://*) ;;
            *) echo "::error title=API_BASE_URL harus https::Nilai saat ini bukan alamat https. Build rilis wajib https agar sandi dan data warga tidak bisa disadap di jaringan."; exit 1 ;;
          esac
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Baca nama versi dari pubspec.yaml
        id: ver
        run: |
          VERSION_NAME=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([^+ ]+).*/\1/')
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
      - run: bash tool/prepare_platforms.sh
      - run: flutter pub get
      - name: Build iOS
        run: >
          flutter build ios --release --no-codesign
          --build-name=${{ steps.ver.outputs.name }}
          --build-number=${{ env.BUILD_NUMBER }}
          --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}
          --dart-define=BUILD_NUMBER=${{ env.BUILD_NUMBER }}
          --dart-define=APP_VERSION=${{ steps.ver.outputs.name }}
      - name: Kemas Runner.app
        run: |
          cd build/ios/iphoneos
          zip -r -q "$GITHUB_WORKSPACE/KampungDigital-ios-unsigned.zip" Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: kampung-digital-ios-unsigned-build-${{ env.BUILD_NUMBER }}
          path: KampungDigital-ios-unsigned.zip
      - name: Ringkasan rilis
        run: |
          {
            echo "### Build iOS (tanpa tanda tangan)"
            echo "- Versi: **${{ steps.ver.outputs.name }}**, nomor build: **${{ env.BUILD_NUMBER }}**"
            echo "- File ini belum bisa dipasang di iPhone. Untuk pengguna, build harus ditandatangani dan didistribusikan lewat TestFlight/App Store (perlu akun Apple Developer); tautan TestFlight/App Store itulah yang diisi di Panel Admin > Rilis aplikasi."
          } >> "$GITHUB_STEP_SUMMARY"
