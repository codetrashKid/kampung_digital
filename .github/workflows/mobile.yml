name: Mobile (Flutter)

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:

env:
  # Alamat API untuk build rilis. Atur di Settings > Secrets and variables > Actions > Variables.
  API_BASE_URL: ${{ vars.API_BASE_URL || 'https://example.invalid' }}

jobs:
  test:
    name: Analisis dan unit test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --coverage
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: mobile/coverage/lcov.info

  build-android:
    name: Build Android (APK)
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/prepare_platforms.sh
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: kampung-digital-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build iOS (tanpa code signing)
    needs: test
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/prepare_platforms.sh
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}
      - name: Kemas Runner.app
        run: |
          cd build/ios/iphoneos
          zip -r -q "$GITHUB_WORKSPACE/KampungDigital-ios-unsigned.zip" Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: kampung-digital-ios-unsigned
          path: KampungDigital-ios-unsigned.zip
